# BatSignal — managed by ./batsignal.sh (you shouldn't need to run compose by hand).
name: batsignal

x-app-env: &app-env
  DB_HOST: db
  DB_NAME: batsignal
  DB_USER: batsignal
  DB_PASS: ${DB_PASSWORD:?Falta DB_PASSWORD al .env}
  APP_DEBUG: "0"
  TZ: ${TZ:-Europe/Madrid}
  HEARTBEAT_URL: ${HEARTBEAT_URL:-}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: batsignal
      MARIADB_USER: batsignal
      MARIADB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD al .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD al .env}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *logging

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: batsignal-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/health.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging

  # Only runs when a domain is configured (menu → Configuració → Domini);
  # gives the panel a name instead of IP:port. Port 443 is added only for
  # real HTTPS, via a docker-compose.override.yml the script generates.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["domain"]
    depends_on:
      web:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *logging

  runner:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: batsignal-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    command: ["/usr/local/bin/runner-loop.sh"]
    healthcheck:
      test: ["CMD", "php", "bin/health.php", "--runner"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    logging: *logging

volumes:
  db_data:
  caddy_data:
  caddy_config:
