; BatSignal container settings
date.timezone = ${TZ}
display_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

; Live progress streaming (run.php) needs unbuffered, uncompressed output.
output_buffering = Off
zlib.output_compression = Off

memory_limit = 256M
max_execution_time = 120

session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
