<VirtualHost *:80>
    # Only public/ is served; app/, bin/, cron/, db/ and vendor/ are not reachable over HTTP.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        Options -Indexes
    </Directory>

    # The Bat-Computer streams live progress from run.php: never compress or buffer it.
    SetEnvIf Request_URI "^/run\.php" no-gzip dont-vary

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
